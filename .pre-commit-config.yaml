minimum_pre_commit_version: '4.6.2'
repos:
  - repo: local
    hooks:
      - id: foundation-checks
        name: Check repository foundation
        entry: python scripts/check_foundation.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Check Python lint
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Check Python formatting
        entry: python -m ruff format --check
        language: system
        types: [python]
