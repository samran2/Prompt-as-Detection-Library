name: Full library checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run library:verify
      - run: npm test
      - run: npm run build
      - name: Install isolated browser QA tools
        run: npm ci --prefix qa --ignore-scripts --no-audit --no-fund
      - name: Check known browser-tool dependency advisories
        run: npm audit --prefix qa --audit-level=high
      - name: Install test browser
        run: node qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test real browser flows on loopback
        run: |
          mkdir -p work/browser-host
          cp -R dist work/browser-host/Prompt-as-Detection-Library
          python3 -m http.server 8766 --bind 127.0.0.1 --directory work/browser-host &
          demo_server_pid=$!
          trap 'kill "$demo_server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8766/Prompt-as-Detection-Library/ >/dev/null; then break; fi
            sleep 1
          done
          DEMO_URL=http://127.0.0.1:8766/Prompt-as-Detection-Library/ node scripts/browser_smoke.cjs
      - name: State verification scope
        run: echo 'Checks the independent ATT&CK 19.2 library, generated text, local CLI and static workbench. Does not validate the unavailable original application, model quality or detection effectiveness.' >> "$GITHUB_STEP_SUMMARY"
