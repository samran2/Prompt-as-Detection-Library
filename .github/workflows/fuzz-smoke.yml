name: Deterministic fuzz smoke

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-smoke:
    name: Untrusted-input fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify JavaScript syntax
        run: npm run check
      - name: Exercise deterministic hostile-input corpus
        run: node --test --test-name-pattern='deterministic adversarial smoke' tests/supply_chain.test.cjs
