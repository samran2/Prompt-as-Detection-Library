name: Research API container security

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '59 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the unprivileged research API image without publishing it
        run: docker build --file apps/research-api/Dockerfile --tag prompt-as-detection-research-api:ci .
      - name: Block high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: prompt-as-detection-research-api:ci
          scanners: vuln,secret
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 10m0s
          cache: true
          version: v0.70.0
