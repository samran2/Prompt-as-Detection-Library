name: Research API container security

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '59 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the unprivileged research API image without publishing it
        run: docker build --file apps/research-api/Dockerfile --tag prompt-as-detection-research-api:ci .
      - name: Block high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: image
          image-ref: prompt-as-detection-research-api:ci
          scanners: vuln,secret
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 10m0s
          cache: false
          version: v0.65.0
