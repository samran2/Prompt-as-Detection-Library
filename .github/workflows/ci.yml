name: Repository CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    uses: ./.github/workflows/demo-checks.yml
  foundation:
    name: Foundation / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Validate hook configuration
        run: python -m pre_commit validate-config
      - name: Check Python lint
        run: python -m ruff check --output-format=github .
      - name: Check Python formatting
        run: python -m ruff format --check .
      - name: Check foundation files and credential patterns
        run: python scripts/check_foundation.py --tracked
      - name: Test repository tooling
        run: python -m unittest discover -s tests -v
      - name: Record limited verification scope
        run: |
          echo 'This job checks repository tooling only. The separate library job checks the independent full-library rebuild. Neither job verifies the unavailable original application or detection effectiveness.' >> "$GITHUB_STEP_SUMMARY"
  quality-gate:
    name: Quality gate
    if: always()
    needs: [library, foundation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete library and foundation checks
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          LIBRARY_RESULT: ${{ needs.library.result }}
        run: |
          test "$FOUNDATION_RESULT" = success
          test "$LIBRARY_RESULT" = success
