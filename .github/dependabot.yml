version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    labels: [dependencies, supply-chain]
    commit-message:
      prefix: deps(actions)

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:10'
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: deps(npm)

  - package-ecosystem: npm
    directory: /qa
    schedule:
      interval: weekly
      day: monday
      time: '06:20'
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: deps(qa)

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: deps(python)
