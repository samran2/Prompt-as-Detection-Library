target-version = "py311"
line-length = 100
# Preserve pinned third-party source bytes, including upstream Markdown examples.
extend-exclude = ["work", "outputs", "sources/attack-19.2/raw", "sources/atlas-2026.08/raw"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[format]
# Imported examples must retain the bytes recorded by skills:verify.
exclude = [".agents/skills/**", ".agents/references/**"]
quote-style = "double"
indent-style = "space"
